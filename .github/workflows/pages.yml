# main에 올라오면 데이터를 검사하고 index.html과 검색엔진·AI용 파일을 만들어 GitHub Pages에 배포한다.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: 데이터 검사
        run: node tools/validate.cjs
      - name: 번역 검사
        # 화면 글자가 모두 TR로 감싸였는지, 번역의 자리표시·태그가 원문과 맞는지. 빈 번역은 한국어로 보이고 경고만 남긴다
        run: |
          npm install --no-save --no-package-lock --ignore-scripts typescript@5 >/dev/null
          node tools/i18n-wrap.cjs --check
          node tools/i18n.cjs check
          node tools/i18n.cjs status | sed 's/^/::notice::번역 /'
      - name: 한국어 문체 검사
        # 번역투·기계 문체의 '오류' 규칙(docs/KO_STYLE.md)이 하나라도 걸리면 멈춘다. 앞 단계에서 설치한 typescript로 코드의 TR 문자열을 읽는다
        run: node tools/ko-style.cjs --strict
      - name: 빌드
        run: |
          python3 build.py
          git diff --quiet index.html || echo "::warning::커밋된 index.html이 src와 다릅니다. python3 build.py 뒤 커밋하세요."
      - name: 검색엔진·AI용 파일 만들기
        # 언어마다 원인·증상별 페이지, 텍스트 판, llms.txt, index.html(정적 사본 포함). sitemap.xml은 언어판을 hreflang으로 잇는다
        run: node tools/site.cjs _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: 검색엔진에 갱신 알리기 (IndexNow)
        # Bing(ChatGPT 검색의 바탕)·Naver 등이 받는다. 실패해도 배포에는 영향 없음
        continue-on-error: true
        run: node tools/indexnow.cjs _site
